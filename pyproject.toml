[project]
name = "streamsense"
version = "0.1.0"
description = "StreamSense application"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "python-dotenv",
    "python-jose[cryptography]",
    "gunicorn",
    "sqlmodel",
    "pydantic",
    "sqlalchemy",
    "timescaledb",
    "requests",
    "ipykernel",
    "python-decouple>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
