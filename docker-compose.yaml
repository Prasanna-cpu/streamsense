services:
  app:
    image: streamsense
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.compose
    environment:
        - DATABASE_URL=postgresql+psycopg2://${TIMESCALE_USER}:${TIMESCALE_PASSWORD}@db_service:5432/${TIMESCALE_DB}
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/code:rw
    develop:
      watch:
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: docker-compose.yaml



  db_service:
    image: timescale/timescaledb:latest-pg17
    environment:
      - POSTGRES_USER=${TIMESCALE_USER}
      - POSTGRES_PASSWORD=${TIMESCALE_PASSWORD}
      - POSTGRES_DB=${TIMESCALE_DB}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    expose:
      - "5432"

volumes:
  timescaledb_data: